name: sync

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "images/**"
      - "scripts/**"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

concurrency:
  group: content-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload images and sync snapshot
        env:
          UNIGO_CONTENT_SYNC_SECRET: ${{ secrets.UNIGO_CONTENT_SYNC_SECRET }}
          UNIGO_SITE_BASE_URL: ${{ vars.UNIGO_SITE_BASE_URL }}
        run: python3 scripts/content_sync.py sync
