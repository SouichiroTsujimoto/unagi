name: validate

on:
  pull_request:
    paths:
      - "articles/**"
      - "images/**"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: content-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run snapshot
        env:
          UNIGO_CONTENT_SYNC_SECRET: ${{ secrets.UNIGO_CONTENT_SYNC_SECRET }}
          UNIGO_SITE_BASE_URL: ${{ vars.UNIGO_SITE_BASE_URL }}
        run: python3 scripts/content_sync.py dry-run
