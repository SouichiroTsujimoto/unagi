root = "."
tmp_dir = "tmp"

[build]
entrypoint = ["./tmp/main"]
cmd = "go tool templ generate -path internal/web && CGO_ENABLED=0 go build -o ./tmp/main ./cmd/server"
delay = 500
exclude_dir = ["tmp", "bin", "tools", ".git", ".certmagic"]
# styles.css is compiled by css-watch → static/app.css; only app.css should trigger a Go rebuild.
# Keep watching Go under internal/web/css (themes.go); exclude the CSS source only.
exclude_regex = ["_templ\\.go", "styles\\.css$"]
include_ext = ["go", "templ", "css"]
kill_delay = "2s"
send_interrupt = true
stop_on_error = true

[log]
# false: show colored build/runner/watcher logs (needed by the dev TUI air panel).
main_only = false
time = false

[misc]
clean_on_exit = true
startup_banner = ""
