# Project defaults for `just run` / listen banner.
# CLI flags and UNIGO_* env vars override these values.

[dev]
logo = true
tui = true

[db]
# Local Supabase Postgres (`supabase start`). Override with UNIGO_DB_DSN.
driver = "postgres"
dsn = "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

[site]
name = "unagi"
description = "wuhu1slandの技術ノート"
base_url = "http://localhost:8080"
# author = "your name"

[banner]
# Optional source image for the listen-banner ASCII logo.
# When set, `just logo` (or `just run` when ASCII is missing/stale) writes
# sibling <name>-ascii.txt (+ .sha256) via ascii-image-converter.
# Commit the image, ascii, and sha256. Embedded default logo is never deleted.
# image = "brand/logo.png"

# Display order is preserved. Use "" for a blank spacer line.
# Keys: version go templ tailwindcss daisyui air mode db css git url pid
fields = [
  "version",
  "go",
  "templ",
  "",
  "mode",
  "db",
  "css",
  "git",
  "",
  "url",
  "pid",
]
